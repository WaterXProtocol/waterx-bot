name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stable toolchain with the components the gates below need. rusqlite's
      # `bundled` feature compiles SQLite from C, but ubuntu-latest already ships
      # a C compiler, and reqwest uses rustls (no OpenSSL system dep).
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # Formatting is enforced via rustfmt.toml (max_width = 110).
      - name: Format
        run: cargo fmt --check

      # Deny any clippy/compiler warning so lint debt can't accumulate.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      # Catch release-only breakage (optimizations, dead-code cfg, etc.).
      - name: Build (release)
        run: cargo build --release --locked
