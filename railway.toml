# Railway config-as-code (https://docs.railway.com/reference/config-as-code).
# The persistent volume + service variables are set in the dashboard (see
# RAILWAY.md) — those can't be declared here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CRITICAL: exactly one replica. The bot polls Telegram getUpdates; two
# processes on the same BOT_TOKEN collide (HTTP 409 conflict).
numReplicas = 1
# It's a worker with no HTTP port — no healthcheckPath. Restart if the process
# ever exits non-zero (a genuinely bad token, or an unexpected panic); normal
# operation never exits (robust_poll loops forever and tolerates network loss).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
