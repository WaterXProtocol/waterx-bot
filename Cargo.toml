[package]
name = "waterx_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
telexide = "0.1.17"
typemap_rev = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
